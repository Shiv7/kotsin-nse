name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: lint
        run: uv run ruff check kotsin_nse tests
      - name: import contracts
        run: uv run lint-imports
      - name: types (no new mypy errors — scripts/mypy_gate.py, baseline backend/mypy-baseline.txt)
        run: uv run python ../scripts/mypy_gate.py
      - name: tests (offline only — `-m live` needs broker credentials)
        run: uv run pytest -m "not live" -q -n auto

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
